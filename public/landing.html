":\"Byt namn\",\"3RIqFZ\":\"Ladda ned chatt\",\"4fXnvy\":\"Ta bort chatt\",\"1Oryj3\":\"Skapar länk …\",\"2aLrKK\":\"Länken har kopierats till urklipp\",\"41QJYc\":\"Det går inte att dela chatten\",\"1BrKhL\":\"Dela chatt\",\"2soqCE\":\"Ta bort länk\",\"3PvhRS\":\"Ta bort länk\",\"3HojkJ\":\"De som har den ursprungliga länken kan inte längre se konversationen.\",\"3TB7DT\":\"Öppna alternativmenyn\",\"S3ONi\":\"Visa tidigare förslag\",\"3OKI2J\":\"Visa fler förslag\",\"2vXXFC\":\"Skanna Marketplace\",\"mBjev\":\"Hjälp mig att hitta coola grejer på Facebook Marketplace som trendar i mitt område.\",\"1fKa93\":\"Sammanfatta mitt e-postmeddelande\",\"1mic7\":\"Läs min e-postinkorg och kalender och sammanfatta mina åtgärdspunkter för den kommande veckan på ett engagerande sätt. Gruppera i avsnitt och använd en tydlig punkt för varje åtgärdspunkt. Fokusera särskilt på e-postinkorgen. Gör inte en lista över alla mina kalenderhändelser, bara framhäv åtgärder jag bör vidta. Notera det aktuella datumet och den aktuella tiden, referera inte till händelser i det förflutna. Skapa detta snabbt! Om jag inte har anslutit min e-post eller kalender ännu, hjälp mig att göra det först.\",\"3svUgO\":\"Skapa en kapselgarderob\",\"1waFPd\":\"Identifiera utifrån min Instagram-aktivitet den estetik jag dras till och skapa en kapselgarderob jag kan köpa och bära som passar min personliga stil.\",\"4hmJwY\":\"Gå igenom e-postmeddelanden som jag inte läst än\",\"22XUhH\":\"Läs igenom min e-post och kalender och ge mig en sammanfattning av saker som jag är sen med att svara på.\",\"4t6DiH\":\"Skapa en måltidsplan med mycket protein\",\"3irSnu\":\"Dela ett proteinrikt matschema för fem dagar som är populärt på Instagram, Facebook och Threads så att jag kan förbereda måltiderna för veckan. Visa mig för varje recept stegvisa instruktioner hur man lagar rätten. När du har valt recepten skapar du en visuell och engagerande artefakt av matschemat med allt innehåll tydligt presenterat och tar med relevanta inlägg från sociala medier på ett visuellt tilltalande sätt för att komplettera recepten. Svara med en mycket kort sammanfattning av artefakten.\",\"1K5yTM\":\"Laga en säsongsbetonad sommarmåltid\",\"3M6BtD\":\"Identifiera ett trendande recept som innehåller säsongsbetonade och lokala ingredienser. Skapa en artefakt för receptet som är engagerande och interaktivt med förslag på alternativ och medieobjekt.\",\"3VY2zN\":\"Planera en koreansk grillmiddag\",\"170syz\":\"Skapa en detaljerad och engagerande artefakt som kan vägleda mig genom tillagningen av en traditionell koreansk grillmiddag hemma\",\"3SCT3N\":\"Skapa en anpassad intresseguide\",\"2lPGTe\":\"Skapa en rik, visuell artefakt med en 10 dagar lång studieplan med frågesporter inom ett ämne som du tror att jag kan vara intresserad av\",\"3QPefy\":\"Planera en perfekt lördag\",\"4xHM83\":\"Jag har en ledig lördag framför mig. Aktivera 3 underombud och ge mig 3 alternativ: något utomhus, något kulturellt och något lättsamt – allt i närheten. Kolla vad som trendar och sker i mitt område i helgen. Inkludera relevant innehåll för att visa vilka alternativ jag har.\",\"1grHMR\":\"Skapa en löpplan för nybörjare\",\"3kWxPB\":\"Jag vill börja löpträna men har ingen erfarenhet. Använd underagenter och ge mig en träningsplan för att klara 5 km samt tips för att inte sluta efter en vecka.\",\"2C99tr\":\"Hitta enkla 20-minutersmål\",\"1FbnXx\":\"Starta 3 underombud och be dem hitta 3 enkla 20-minutersmåltider baserat på vad som trendar på Instagram – en med grönsaker, en med kyckling och en med pasta.\",\"4iUIVD\":\"Jämför alla typer av ren energi\",\"XgbM9\":\"Gå igenom solenergi, vindkraft, vattenkraft, kärnkraft och geotermisk energi. Använd underombud för att förklara hur energikällan omvandlas till elektricitet. Generera en övergripande infograf och diagram.\",\"4zbgkA\":\"Gör en lookbook till mig\",\"4B4RrG\":\"Skapa en lookbook åt mig med lovande varumärken som jag faktiskt skulle gilla baserat på min Instagram-smak. Hitta plagg som jag verkligen kan köpa och berätta om dem. Ge varje look en egen sida med plaggen arrangerade tillsammans som en stylad outfittavla, så att jag får se hur plaggen ter sig tillsammans i en vy. Lägg till en kort anteckning om viben och lägg till reels för att skapa en rik visuell upplevelse. Få det att kännas som ett tidningsuppslag som jag kan titta igenom.\",\"44DStf\":\"Förvandla anteckningar till en studieguide\",\"2TehQh\":\"Jag skickar en bild av mina handskrivna anteckningar. Transkribera dem och skapa ett interaktivt dokument organiserat efter ämne med frågesporter som testar min förståelse.\",\"2Pjmv8\":\"Sammanfatta min kalender och e-post\",\"2iqhus\":\"Läs min e-postinkorg och kalender och sammanfatta mina åtgärdspunkter för den kommande veckan på ett engagerande sätt. Gruppera i avsnitt och använd en tydlig punkt för varje åtgärdspunkt. Fokusera särskilt på e-postinkorgen. Gör inte en lista över alla mina kalenderhändelser, bara framhäv åtgärder jag bör vidta. Notera det aktuella datumet och den aktuella tiden, referera inte till händelser i det förflutna. Skapa detta snabbt! Om jag inte har anslutit min e-post eller kalender ännu, hjälp mig att göra det först. Fråga mig efter körningen om jag vill göra detta till en daglig schemalagd uppgift.\",\"2gJBxQ\":\"Skapa ett 20 minuter långt träningspass att göra varje dag\",\"B8bS6\":\"Skapa en daglig uppgift för kl. 06:00. Ge mig ett 20-minuters träningspass hemma utan utrustning. Rotera muskelgrupperna så att de varierar och byggs upp under veckan. Berätta vad fokus är för dagen och hur hårt det ska kännas. För varje övning vill jag ha en tydlig bild, tydliga instruktioner med en teknik- eller säkerhetspåminnelse samt antal repetitioner eller intervaller med arbete och vila. Lägg till en kort uppvärmning och nedvarvning och ge ett enklare och ett svårare alternativ. Hela passet ska vara ungefär 20 minuter.\",\"40T1xV\":\"Granska mina betalda prenumerationer\",\"lUoUD\":\"Gå igenom alla
